name: raginject security regression

on: [pull_request]

jobs:
  raginject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install raginject

      # Point --target-module at your own RAG entry point instead, e.g.:
      #   --target-module myapp.rag:answer_question
      # (it must be importable from the repo root; raginject adds the
      # current working directory to sys.path for you). This step uses the
      # dependency-free demo target so the workflow is runnable as-is - see
      # `raginject.demo` in README.md. For the full real-target recipe -
      # installing your app, secrets, a JSON artifact, and optional
      # llm_judge verification - see
      # `example_ci_github_actions_real_target.yml`.
      - run: |
          raginject run \
            --target-module raginject.demo:defended_rag \
            --min-score 0.8
