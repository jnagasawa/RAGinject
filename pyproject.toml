[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raginject"
version = "0.1.0"
description = "Evaluation harness for indirect prompt injection and retrieval poisoning resistance in RAG pipelines"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Junichi Nagasawa" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "click>=8.0",
]

[project.optional-dependencies]
llm-judge = ["openai>=1.0", "anthropic>=0.30"]

[project.scripts]
raginject = "raginject.cli:main"

[tool.setuptools.packages.find]
include = ["raginject*"]

[tool.setuptools.package-data]
raginject = ["attacks/patterns/*.yaml", "py.typed"]

[tool.ruff]
target-version = "py39"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.5",
]
